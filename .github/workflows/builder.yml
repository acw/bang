name: Matrix
on:
  - pull_request
  - push:
      branches:
        - main
        - 'releases/**'

jobs:
  strategy:
    matrix:
      rust:
        - stable
        - beta
        - nightly

  main:
    name: ${{matrix.rust}}
    runs-on: x86_64-linux
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          components: rustfmt, clippy
      - run: rustup --version
      - run: rustc -vV

      - run: cargo clippy
      - run: cargo fmt --all -- --check
      - run: cargo test
